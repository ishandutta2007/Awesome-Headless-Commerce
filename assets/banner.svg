<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibrant Gradient for Title -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .node-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.25;
      stroke-width: 1;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />

  <!-- Grid Decoration -->
  <g class="grid-line">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Animated Glowing Background Orbs -->
  <circle cx="150" cy="100" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cx" values="150;200;150" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;140;100" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="240" r="160" fill="#06b6d4" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cx" values="1050;1000;1050" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="240;200;240" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="180" r="120" fill="#c084fc" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="120;150;120" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Left / Center Content: Title & Tagline -->
  <g transform="translate(70, 0)">
    <!-- Header Category Tag -->
    <rect x="0" y="55" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <circle cx="16" cy="70" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="75" class="tagline">COMPOSABLE COMMERCE</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title" fill="url(#title-grad)" filter="url(#subtle-glow)">
      Awesome Headless Commerce
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle">
      Curated ecosystem of SaaS platforms &amp; open-source architectures
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="24" class="node-text">⚡ API-First Backends</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="203" y="24" class="node-text">🛍️ Modern Storefronts</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="170" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="398" y="24" class="node-text">🌐 Multi-Market &amp; B2B</text>

      <!-- Pill 4 -->
      <rect x="565" y="0" width="160" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="583" y="24" class="node-text">📦 Omnichannel OMS</text>
    </g>
  </g>

  <!-- Right Visual: Composable Decoupled Diagram -->
  <g transform="translate(920, 80)">
    <!-- Frontend Node -->
    <rect x="40" y="10" width="130" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="105" y="36" class="node-text" text-anchor="middle">🎨 Storefront UI</text>

    <!-- Connection Line with moving pulse -->
    <path d="M 105 52 L 105 105" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite" />
    </path>

    <!-- API Gateway / GraphQL Node -->
    <rect x="30" y="105" width="150" height="42" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" filter="url(#subtle-glow)" />
    <text x="105" y="131" class="node-text" text-anchor="middle">⚡ GraphQL / REST</text>

    <!-- Branching Lines -->
    <path d="M 75 147 L 45 190" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M 135 147 L 165 190" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite" />
    </path>

    <!-- Backend Services -->
    <rect x="0" y="190" width="95" height="36" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="47" y="213" class="node-text" font-size="11" text-anchor="middle">🛒 Cart / Order</text>

    <rect x="115" y="190" width="95" height="36" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <text x="162" y="213" class="node-text" font-size="11" text-anchor="middle">📦 PIM / Catalog</text>
  </g>
</svg>
